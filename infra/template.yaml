AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Budgeting App - native CloudFormation only (no SAM transform).
  VPC + Aurora Serverless v2 + Cognito + API Gateway HTTP API + Lambda.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  DBName:
    Type: String
    Default: budgeting
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"

  DBMasterUsername:
    Type: String
    Default: budgetadmin
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"

  EngineVersion:
    Type: String
    Default: "16.4"

  MaxCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 16

  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "[a-z0-9-]+"
    Description: >
      Globally unique prefix for the Cognito hosted UI domain.
      Must match [a-z0-9-]+ and be unique across all AWS accounts.

  FrontendUrl:
    Type: String
    Default: "http://localhost:5173"
    Description: Frontend origin - update to CloudFront URL after item 8.

  AlertEmail:
    Type: String
    Default: "nnsar2112@gmail.com"
    Description: Email address that receives billing alarm notifications.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ----- Networking -------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-b"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ----- Security groups --------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG for App/Ingest Lambdas (in-VPC).
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound to VPC endpoints and Aurora.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-lambda-sg"

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG for Aurora - Postgres from Lambda only.
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  DatabaseIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Postgres from Lambda SG.

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG for interface VPC endpoints - 443 from Lambda only.
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpce-sg"

  VpcEndpointIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: HTTPS from Lambda SG.

  # ----- VPC endpoints ----------------------------------------------------
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ----- Database ---------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Aurora.
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersion
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: !Ref MaxCapacity
        SecondsUntilAutoPause: 300
      StorageEncrypted: true
      EnableCloudwatchLogsExports:
        - postgresql

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  # ----- Auth (Cognito) ---------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      EmailVerificationMessage: "Your Budgeting App verification code is {####}"
      EmailVerificationSubject: "Verify your Budgeting App account"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-app-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub "${FrontendUrl}/callback"
        - "http://localhost:5173/callback"
      LogoutURLs:
        - !Ref FrontendUrl
        - "http://localhost:5173"
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

  # ----- Lambda IAM role --------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # AWSLambdaVPCAccessExecutionRole covers VPC attachment + CloudWatch Logs.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadDBSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

  # ----- CloudWatch log groups -------------------------------------------
  # Declared explicitly so CloudFormation owns the retention policy.
  # Lambda would otherwise auto-create these with no expiry.
  AppFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-app"
      RetentionInDays: 30

  MigrationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-migrate"
      RetentionInDays: 30

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-access"
      RetentionInDays: 30

  # ----- Billing alarm ----------------------------------------------------
  BillingAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-billing"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Billing metrics are only emitted in us-east-1.
  # Estimated charges alarm fires when the daily max exceeds $10.
  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-billing-$10"
      AlarmDescription: "Estimated AWS charges exceeded $10"
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref BillingAlarmTopic
      TreatMissingData: notBreaching

  # ----- API Gateway HTTP API ---------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendUrl
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId",
          "ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime",
          "method":"$context.httpMethod",
          "routeKey":"$context.routeKey",
          "status":"$context.status",
          "responseLatency":"$context.responseLatency",
          "integrationLatency":"$context.integrationLatency",
          "userAgent":"$context.identity.userAgent"}

  # JWT authorizer: validates the Cognito token using Cognito's JWKS endpoint.
  # Invalid/missing tokens are rejected here before any Lambda runs.
  CognitoJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: CognitoJwt
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
        Audience:
          - !Ref CognitoUserPoolClient

  # ----- App Lambda -------------------------------------------------------
  AppFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-app"
      # Local path - aws cloudformation package zips and uploads this to S3.
      Code: ../backend/dist/app/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 29
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          DB_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
          DB_NAME: !Ref DBName

  AppFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AppFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  AppFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  GetMeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /me"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  # ----- Accounts routes --------------------------------------------------
  ListAccountsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /accounts"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  CreateAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /accounts"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  UpdateAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /accounts/{id}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  DeleteAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /accounts/{id}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  # ----- Categories routes ------------------------------------------------
  ListCategoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /categories"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  CreateCategoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /categories"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  UpdateCategoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /categories/{id}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  DeleteCategoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /categories/{id}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  # ----- Transactions routes ----------------------------------------------
  ListTransactionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /transactions"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  CreateTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /transactions"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  UpdateTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /transactions/{id}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  DeleteTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /transactions/{id}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  # ----- Summary route ----------------------------------------------------
  GetSummaryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /summary"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  # ----- Budgets routes --------------------------------------------------
  UpsertBudgetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /budgets"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  DeleteBudgetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /budgets/{categoryId}/{period}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AppFunctionIntegration}"

  # ----- Frontend (S3 + CloudFront) --------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          ViewerProtocolPolicy: redirect-to-https
          TargetOriginId: FrontendS3Origin
          # CachingOptimized managed policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
        # Return index.html for any path so the SPA handles routing client-side
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ----- Migration Lambda -------------------------------------------------
  MigrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-migrate"
      Code: ../backend/dist/migrate/
      Handler: migrate.handler
      Runtime: nodejs20.x
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          DB_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
          DB_NAME: !Ref DBName

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  VpcId:
    Value: !Ref Vpc

  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]

  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup

  DBClusterEndpoint:
    Value: !GetAtt AuroraCluster.Endpoint.Address

  DBSecretArn:
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

  UserPoolId:
    Value: !Ref CognitoUserPool

  UserPoolClientId:
    Value: !Ref CognitoUserPoolClient

  UserPoolIssuerUrl:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"

  HostedUiUrl:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${CognitoUserPoolClient}&response_type=code&scope=openid+email+profile&redirect_uri=http://localhost:5173/callback"

  ApiUrl:
    Description: "API base URL. Test: curl -H 'Authorization: Bearer <token>' <ApiUrl>/me"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  BillingAlarmName:
    Value: !Ref BillingAlarm

  FrontendBucketName:
    Value: !Ref FrontendBucket

  CloudFrontUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"

  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
